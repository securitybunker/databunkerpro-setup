services:
  oracle:
    image: gvenzl/oracle-free:slim
    restart: unless-stopped
    env_file:
      - .env/oracle.env
    volumes:
      - oracle-data:/opt/oracle/oradata
      # --- TLS (optional) --- run `./generate-env-files.sh ssl` to pack the wallet,
      # then uncomment the wallet mount + the 2484 port and mount the sqlnet.ora /
      # listener.ora shown in generate-env-files.sh into the image's TNS_ADMIN
      # (= $ORACLE_HOME/network/admin, e.g. /opt/oracle/product/26ai/dbhomeFree/network/admin):
      # - ./.env/wallet:/opt/oracle/wallet
      # - ./.env/sqlnet.ora:/opt/oracle/product/26ai/dbhomeFree/network/admin/sqlnet.ora
      # - ./.env/listener.ora:/opt/oracle/product/26ai/dbhomeFree/network/admin/listener.ora
    ports:
      - "127.0.0.1:1521:1521"
      # - "127.0.0.1:2484:2484"   # TLS (TCPS) listener — uncomment with the TLS mounts above
  redis:
    image: redis
    restart: unless-stopped
    env_file:
      - .env/redis.env
    command: /bin/sh -c "redis-server --requirepass $$REDIS_USER_PASS"
    ports:
      - "127.0.0.1:6379:6379"
  databunkerpro:
    image: securitybunker/databunkerpro:latest
    restart: unless-stopped
    env_file:
      - .env/databunker.env
    volumes:
      - ../conf/databunker.yaml:/databunker/conf/databunker.yaml
    entrypoint: /bin/sh
    command: -c "/databunker/bin/databunkerpro -db databunkerdb -conf /databunker/conf/databunker.yaml"
    depends_on:
      - oracle
    ports:
      - 3000:3000

volumes:
  oracle-data:
